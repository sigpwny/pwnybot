name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pwnybot-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
      DISCORD_PUBLIC_KEY: ${{ vars.DISCORD_PUBLIC_KEY }}
      GUILD_IDS: ${{ vars.GUILD_IDS }}
      CTF_CATEGORY_CHANNELS: ${{ vars.CTF_CATEGORY_CHANNELS }}
      CTF_ROLES: ${{ vars.CTF_ROLES }}
      UIUC_ROLES: ${{ vars.UIUC_ROLES }}
      MODERATOR_ROLES: ${{ vars.MODERATOR_ROLES }}
      PRIVATE_ROLES: ${{ vars.PRIVATE_ROLES }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Configure D1 binding
        run: |
          node -e 'const fs=require("fs"); const p="wrangler.jsonc"; const c=JSON.parse(fs.readFileSync(p,"utf8")); c.d1_databases[0].database_id=process.env.D1_DATABASE_ID; fs.writeFileSync(p, JSON.stringify(c, null, 2));'
      - name: Apply D1 migrations
        run: npm run db:migrate:remote
      - name: Deploy Worker
        run: |
          npx wrangler deploy \
            --var "DISCORD_APPLICATION_ID:$DISCORD_APPLICATION_ID" \
            --var "DISCORD_PUBLIC_KEY:$DISCORD_PUBLIC_KEY" \
            --var "GUILD_IDS:$GUILD_IDS" \
            --var "CTF_CATEGORY_CHANNELS:$CTF_CATEGORY_CHANNELS" \
            --var "CTF_ROLES:$CTF_ROLES" \
            --var "UIUC_ROLES:$UIUC_ROLES" \
            --var "MODERATOR_ROLES:$MODERATOR_ROLES" \
            --var "PRIVATE_ROLES:$PRIVATE_ROLES"
      - name: Set Worker secret
        run: printf '%s' "$DISCORD_BOT_TOKEN" | npx wrangler secret put DISCORD_BOT_TOKEN
      - name: Register guild commands
        run: npm run discord:commands:register
