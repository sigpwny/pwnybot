name: Deploy to Server
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_PRIVATE_KEY" | base64 --decode > "$SSH_KEY_PATH"
          chmod 600 "$SSH_KEY_PATH"
          echo "$SSH_KNOWN_HOSTS" | base64 -d > ~/.ssh/known_hosts
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{secrets.SSH_PRIVATE_KEY}}
          SSH_KNOWN_HOSTS: ${{secrets.SSH_KNOWN_HOSTS}}
          SSH_KEY_PATH: ${{ github.workspace }}/../private.key
      - name: Check out repository code
        uses: actions/checkout@v5
      - name: Install WireGuard
        run: |
          sudo apt-get update
          sudo apt-get install --yes wireguard-tools resolvconf
      - name: Connect to WireGuard server
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          umask 077
          printf '%s\n' "$WIREGUARD_CONFIG" > "$RUNNER_TEMP/wg0.conf"
          sudo wg-quick up "$RUNNER_TEMP/wg0.conf"
          sudo wg show wg0

      - name: Redeploy pwnybot
        run: |
          cat deploy.sh | ssh -o BatchMode=yes -o ConnectTimeout=15 -i "$SSH_KEY_PATH" "$SERVER_USER@$SERVER_IP"
        shell: bash
        env:
          SSH_KEY_PATH: ${{ github.workspace }}/../private.key
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
      - name: Disconnect WireGuard
        if: always()
        run: |
          status=0
          if sudo wg show wg0 >/dev/null 2>&1; then
            sudo wg-quick down "$RUNNER_TEMP/wg0.conf" || status=$?
          fi
          rm -f "$RUNNER_TEMP/wg0.conf"
          exit "$status"
